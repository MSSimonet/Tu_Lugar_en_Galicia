# sonar-project.properties — Tu Lugar en Galicia

sonar.projectKey=tu-lugar-en-galicia
sonar.projectName=Tu Lugar en Galicia
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Código fuente real del proyecto — NO la raíz completa del filesystem.
# docs/, content/, .claude/ y public/ quedan fuera por no estar listados aquí.
sonar.sources=app,components,lib,middleware.ts,next.config.ts,scripts

# TypeScript estricto: usar el tsconfig raíz del proyecto
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusiones explícitas (defensa en profundidad, por si sonar.sources se amplía
# a futuro): assets binarios de public/, build artifacts, deps, y el git worktree
# duplicado en .claude/worktrees/ que generaba falsos positivos de duplicación.
sonar.exclusions=\
  public/videos/**,\
  public/images/**,\
  public/leaflet/**,\
  public/iconos/**,\
  public/*.svg,\
  public/*.jpg,\
  public/*.png,\
  app/favicon.ico,\
  node_modules/**,\
  .next/**,\
  .vercel/**,\
  .unlighthouse/**,\
  coverage/**,\
  .claude/**
